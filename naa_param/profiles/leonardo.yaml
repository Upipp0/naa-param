# leonardo cluster profile — generated by `naa-param add-profile`.
# Used by: naa-param setup ... --profile leonardo
name: "leonardo"
# Your Slurm account: supply it per run with `naa-param setup --account ...`,
# or bake it into your own copy with `naa-param add-profile`.
account:
partition: "boost_usr_prod"
nodes: 1
ntasks_per_node: 1
cpus: 32
mem: "360000MB"
time: "24:00:00"
rename_cpus: 1
rename_mem: "4000MB"
rename_time: "00:30:00"
gather_cpus: 1
gather_mem: "8000MB"
gather_time: "04:00:00"
scratch_base: "${TMPDIR:-/tmp}"
env_setup: |
  module purge
  module load profile/chem-phys
  module load g16
  module load amber
  . $g16root/g16/bsd/g16.profile

  # `module load amber` pulls python/3.10.8 and py-numpy/1.23.4 in as
  # dependencies and exports a PYTHONPATH pointing at them. Python searches
  # PYTHONPATH *before* an activated virtualenv's site-packages, so that numpy
  # — built as cpython-310 — shadows the venv's and fails to import under the
  # venv's 3.11 interpreter:
  #
  #     ImportError: Importing the numpy C-extensions failed
  #
  # AmberTools is used through its binaries (antechamber, espgen, resp), never
  # its python modules, so dropping PYTHONPATH costs nothing.
  unset PYTHONPATH

  # Deliberately no `module load python`: amber has already loaded 3.10.8, so
  # this errors with "Conflicting python is loaded" and silently does nothing.
  # The venv carries its own interpreter and needs no python module.
  # Activate the environment where `naa-param` is installed (EDIT THIS PATH):
  source "$HOME/naa-param/.venv/bin/activate"
